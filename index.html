<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海大電機・學程島</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e6f4f7;--sea:#bfe3ee;--ink:#12303b;--card:#fff;--muted:#4b6a75;--accent:#0b7a9b;--sand:#f3e3b3;--line:#b9d6df;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2230;--sea:#123b52;--ink:#e7f3f7;--card:#16313f;--muted:#9bbac6;--accent:#5cc7e6;--sand:#6b5d33;--line:#2a5063;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d2230;--sea:#123b52;--ink:#e7f3f7;--card:#16313f;--muted:#9bbac6;--accent:#5cc7e6;--sand:#6b5d33;--line:#2a5063;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
header{text-align:center;padding:18px 12px 0}
h1{margin:0;font-size:clamp(20px,4vw,30px)}header p{margin:4px 0 0;color:var(--muted);font-size:14px}
main{max-width:900px;margin:0 auto;padding:8px 12px 28px}
.sea{background:radial-gradient(circle at 50% 45%,var(--sea),var(--bg) 85%);border-radius:20px;border:1px solid var(--line)}
svg{width:100%;height:auto;display:block}
.hex{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.hex:hover,.hex.on{transform:translateY(-6px)}
.hex.on polygon.top{stroke:var(--ink);stroke-width:3}
.hex text{pointer-events:none;font-weight:700;fill:#fff;text-anchor:middle;font-size:15px}
.who{cursor:pointer}.who:hover .body,.who.on .body{filter:brightness(1.15)}
.who.on .tag rect{fill:var(--accent)}.who .tag rect{fill:var(--card);stroke:var(--line)}
.who .tag text{font-size:14px;font-weight:700;text-anchor:middle;fill:var(--ink)}.who.on .tag text{fill:#fff}
.bob{animation:bob 2.4s ease-in-out infinite}.who:nth-of-type(2n) .bob{animation-delay:-1s}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
#panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.say{display:flex;gap:12px;align-items:flex-start}
.say svg{width:64px;flex:none}
.bubble{background:var(--bg);border-radius:14px;padding:10px 14px;position:relative}
.bubble h2{margin:0 0 4px;font-size:18px}.bubble p{margin:0}
h3{font-size:14px;color:var(--muted);margin:16px 0 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.cols{grid-template-columns:1fr}}
.chip{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chip.hi{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 0}
.note{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header>
<h1>🏝️ 國立臺灣海洋大學・電機工程學系 學程島</h1>
<p>點選島上的學生或六大學程領域，聽系主任為你介紹</p>
</header>
<main>
<div class="sea"><svg id="map" viewBox="0 0 700 540" role="img" aria-label="電機系學程島互動地圖"></svg></div>
<p class="hint">👆 點學生看各年級課程　👆 點六角地塊看學程介紹　👆 點系主任回到總覽</p>
<section id="panel" aria-live="polite"></section>
<p class="note">資料來源：電機系大學部必修與核心課程關聯圖、碩士班選修課程關聯圖。學程介紹文字為示意說明，實際課程以系上公告為準。</p>
</main>
<script>
const YEARS=[
{n:"大一",c:"#f2a65a",up:["計算機概論","計算機實習","普通物理","程式語言","普通物理實驗","微積分"],dn:["普通物理","普通物理實驗","微積分","工程數學","電路學","交換電路與邏輯設計"],say:"大一是打地基的一年：微積分、物理與程式語言，是日後所有電機課程的共同語言。"},
{n:"大二",c:"#6fbf73",up:["工程數學","電磁學","線性代數","電路學","電子學","電工實驗"],dn:["電子學","電工實驗","電磁波","訊號與系統","機率學","資料結構","複變函數"],say:"大二開始進入電機核心：電路、電子、電磁與訊號，並從電工實驗親手驗證理論。"},
{n:"大三",c:"#5b9bd5",up:["電子學","電工實驗","近代物理","自動控制","電機機械","通訊工程"],dn:["電子電路","電工實驗","六選四（必選）"],say:"大三要開始思考方向了！下學期要從六大學程領域中選修，這是你的專長起點。"},
{n:"大四",c:"#b07cd6",up:["電工實驗"],dn:[],say:"大四是專題與專業深化的階段，依照你選的學程領域修習進階課程，也可以預先接觸碩士班選修。",focus:true}];
const PROG=[
{n:"通訊與訊號處理",c:"#e0605a",dx:-52,dy:-90,core:["訊號與系統","通訊工程","機率學"],say:"手機、Wi-Fi、聲納都靠這個領域！學習如何把訊號傳出去、收進來，並從雜訊中找出有用的資訊。",ms:["數位訊號處理","數位通訊系統","信號偵測與估計","無線通訊","電資醫學概論","設計概論","適應訊號處理","時頻分析","行動通訊系統","聲納訊號處理","通訊系統設計與模擬","健康照護醫療應用專題"]},
{n:"控制",c:"#4aa3a0",dx:52,dy:-90,core:["自動控制","線性代數","工程數學"],say:"讓機器自己「聽話」：從船舶、機器人到工廠自動化，都需要控制系統穩定又精準地運作。",ms:["矩陣理論與運用","網路控制系統","適應控制","非線性系統分析","切換控制系統","現代控制理論","多變數控制系統"]},
{n:"固態電子",c:"#d9a441",dx:104,dy:0,core:["近代物理","電子學","半導體物理"],say:"晶片與光電元件的根本！從半導體物理、積體電路到太陽能電池，是現代科技的核心。",ms:["光電元件","類比積體電路設計","太陽能光伏電子應用","化合物半導體工程元件","奈微米元件製程與模擬","電子設計自動化","光電轉換導論","微光機電感測工程","太陽能電池","超大型積體電路設計","電力電子積體電路設計","超大型積體電路技術","太陽能光伏電子應用專題","能量轉換元件特性分析與模擬","智慧體溫血壓照護"]},
{n:"電力與電子電路",c:"#8b6fd1",dx:52,dy:90,core:["電機機械","電子電路","電路學"],say:"電力從哪裡來、如何穩定送到每個家庭？這裡學電力系統、電源轉換與電力電子，與綠能息息相關。",ms:["電力電子學","作業研究","智慧體溫血壓照護","電力系統規劃與運轉","電力系統動態分析","電源供應器設計","模糊系統","電力系統調度","保護電驛","電力系統控制與穩定","電能系統分析實驗"]},
{n:"電波",c:"#3c8dd9",dx:-52,dy:90,core:["電磁學","電磁波","複變函數"],say:"無線世界的幕後功臣：天線、微波、雷達與導引波，讓訊號在空中與海面上自由傳遞。",ms:["微波電路設計","雷達技術","導引波理論（一）","導引波理論（二）","電磁理論","計算電磁學"]},
{n:"資訊科技",c:"#e07fb0",dx:-104,dy:0,core:["資料結構","程式語言","交換電路與邏輯設計"],say:"軟體與硬體的交會點：嵌入式系統、影像處理與人工智慧，都從扎實的程式與邏輯基礎出發。",ms:["類神經網路","生醫電子","軟體工程","圖形辨識","軟性計算導論","車用電子","數位影像處理","數位系統塑模與合成","高等嵌入式系統理論"]}];
const $=s=>document.querySelector(s),svg=$("#map"),CX=350,CY=240,S=60;
const hexPts=(x,y,s)=>[...Array(6)].map((_,i)=>{const a=Math.PI/180*(60*i-30);return(x+s*Math.cos(a)).toFixed(1)+","+(y+s*Math.sin(a)).toFixed(1)}).join(" ");
const person=(c,chair)=>`<g class="bob"><ellipse cy="40" rx="20" ry="6" fill="rgba(0,0,0,.18)"/><rect class="body" x="-14" y="6" width="28" height="32" rx="12" fill="${c}"/><circle cy="-6" r="14" fill="#ffd9b3"/><path d="M-14 -8Q0 -26 14 -8Q0 -14 -14 -8Z" fill="#3a2a22"/><circle cx="-5" cy="-5" r="1.8" fill="#222"/><circle cx="5" cy="-5" r="1.8" fill="#222"/><path d="M-4 2Q0 5 4 2" stroke="#222" fill="none" stroke-width="1.4"/>${chair?'<circle cx="-5" cy="-5" r="4.5" fill="none" stroke="#222"/><circle cx="5" cy="-5" r="4.5" fill="none" stroke="#222"/><path d="M0 8l-4 6 4 14 4-14z" fill="#c0392b"/>':'<rect x="-9" y="22" width="18" height="4" rx="2" fill="rgba(255,255,255,.5)"/>'}</g>`;
let h=`<path d="M60 250Q70 90 350 70Q640 90 650 250Q640 420 350 440Q70 420 60 250Z" fill="var(--sand)" opacity=".9"/><path d="M110 250Q120 120 350 100Q580 120 590 250Q580 400 350 410Q120 400 110 250Z" fill="#8fcf9b" opacity=".55"/>`;
h+=`<g class="hex" id="hc"><polygon class="top" points="${hexPts(CX,CY,S)}" fill="#f4f0e0" stroke="#fff" stroke-width="2"/><text x="${CX}" y="${CY+34}" style="fill:#12303b;font-size:12px">核心課程</text></g>`;
PROG.forEach((p,i)=>{const x=CX+p.dx,y=CY+p.dy;h+=`<g class="hex" data-p="${i}" tabindex="0" role="button" aria-label="${p.n}學程"><polygon points="${hexPts(x,y+8,S-2)}" fill="rgba(0,0,0,.25)"/><polygon class="top" points="${hexPts(x,y,S-2)}" fill="${p.c}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+2}">${p.n.length>4?p.n.slice(0,p.n.length>5?2:2)+"":p.n}</text>${p.n.length>4?`<text x="${x}" y="${y+20}">${p.n.slice(2)}</text>`:""}</g>`});
h+=`<g class="who" id="chair" tabindex="0" role="button" aria-label="系主任" transform="translate(${CX},${CY-6}) scale(1.25)">${person("#2b4a6b",true)}<g class="tag" transform="translate(0,56)"><rect x="-26" y="-12" width="52" height="20" rx="10"/><text y="3">系主任</text></g></g>`;
YEARS.forEach((y,i)=>{h+=`<g class="who" data-y="${i}" tabindex="0" role="button" aria-label="${y.n}學生" transform="translate(${130+i*147},${470})">${person(y.c)}<g class="tag" transform="translate(0,58)"><rect x="-24" y="-12" width="48" height="20" rx="10"/><text y="3">${y.n}</text></g></g>`});
svg.innerHTML=h;
const chip=(a,cl="")=>a.length?a.map(t=>`<span class="chip ${cl}">${t}</span>`).join(""):'<span class="chip">—</span>';
function chairSvg(){return`<svg viewBox="-24 -30 48 84" aria-hidden="true">${person("#2b4a6b",true)}</svg>`}
function show(title,say,body){$("#panel").innerHTML=`<div class="say">${chairSvg()}<div class="bubble"><h2>${title}</h2><p>${say}</p></div></div>${body}`}
function clear(){svg.querySelectorAll(".on").forEach(e=>e.classList.remove("on"))}
function home(){clear();show("歡迎來到電機島！","我是電機系系主任。島上的四位同學從大一走到大四，周圍六塊領域則是你將來可以選擇的專長學程，來逛逛吧！",`<h3>四年修課脈絡</h3><p>大一～大二修習共同與核心基礎，大三起從六大領域中選修（${"六選四"}），大四深化專業，亦可銜接碩士班選修課程。</p><h3>共同課程</h3>${chip(["國文領域","外文領域","歷史領域","體育","勞動服務","博雅領域","憲政領域"])}`)}
function year(i){clear();svg.querySelector(`[data-y="${i}"]`).classList.add("on");const y=YEARS[i];
show(y.n+"的同學",y.say,`<div class="cols"><div><h3>上學期</h3>${chip(y.up)}</div><div><h3>下學期</h3>${chip(y.dn)}</div></div>${y.focus?`<h3>大四可選的六大學程領域</h3>${chip(PROG.map(p=>p.n+"領域"),"hi")}`:""}${i==2?`<h3>下學期的六選四，可選領域</h3>${chip(PROG.map(p=>p.n+"領域"),"hi")}`:""}`)}
function prog(i){clear();svg.querySelector(`[data-p="${i}"]`).classList.add("on");const p=PROG[i];
show(p.n+"學程",p.say,`<h3>大學部相關核心課程</h3>${chip(p.core,"hi")}<h3>碩士班延伸專業選修</h3>${chip(p.ms)}`)}
svg.addEventListener("click",e=>{const g=e.target.closest("g[data-p],g[data-y],#chair,#hc");if(!g)return;
if(g.dataset.p!=null)prog(+g.dataset.p);else if(g.dataset.y!=null)year(+g.dataset.y);else home()});
svg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
home();
</script>
</body>
</html>
